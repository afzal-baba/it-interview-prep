  <!-- Stats row -->
  <text x="80" y="490" font-family="monospace" font-size="28" font-weight="700" fill="#5BE3D8">40</text>
  <text x="80" y="516" font-family="Arial, sans-serif" font-size="13" fill="#5A6A8A" letter-spacing="1">TECHNOLOGIES</text>

  <text x="260" y="490" font-family="monospace" font-size="28" font-weight="700" fill="#8F7BF0">1200+</text>
  <text x="260" y="516" font-family="Arial, sans-serif" font-size="13" fill="#5A6A8A" letter-spacing="1">QUESTIONS</text>

  <text x="460" y="490" font-family="monospace" font-size="28" font-weight="700" fill="#F0B84F">Free</text>
  <text x="460" y="516" font-family="Arial, sans-serif" font-size="13" fill="#5A6A8A" letter-spacing="1">ALWAYS FREE</text>

