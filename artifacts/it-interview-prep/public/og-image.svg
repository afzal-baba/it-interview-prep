  <rect x="80" y="100" width="260" height="36" rx="18" fill="#13182A" stroke="#2A3050" stroke-width="1"/>
  <circle cx="103" cy="118" r="5" fill="#5BE3D8"/>
  <text x="118" y="123" font-family="monospace" font-size="13" fill="#5BE3D8" letter-spacing="2" text-anchor="start">TECHNICAL INTERVIEW</text>

  <!-- Main title line 1 -->
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-3">Ace your next</text>

  <!-- Main title line 2 (gradient) -->
  <text x="80" y="330" font-family="Arial, sans-serif" font-size="82" font-weight="900" fill="url(#title)" letter-spacing="-3">technical interview.</text>

  <!-- Subtitle -->
  <!-- SOURCE OF TRUTH: artifacts/it-interview-prep/src/lib/platform-stats.ts -->
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="22" fill="#8090B8">1200+ questions across 40 technologies · Timed mode · Real-time challenges</text>

  <!-- Divider -->
