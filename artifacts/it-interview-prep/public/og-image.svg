    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#5F78F0;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#5F78F0;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#5BE3D8;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#5BE3D8;stop-opacity:0"/>
