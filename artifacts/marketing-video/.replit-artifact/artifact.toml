kind = "video"
previewPath = "/marketing-video/"
title = "IT Interview Prep — Promo Video"
description = "An energetic animated marketing video showcasing the IT Interview Prep platform. Fast cuts, bold kinetic typography, and hype energy across 5 scenes: hook, course flash, quiz simulation, badge reveal, and leaderboard CTA."
version = "1.0.0"
id = "artifacts/marketing-video"
router = "path"

[[services]]
name = "web"
paths = [ "/marketing-video/" ]
localPort = 18472

[services.development]
run = "pnpm --filter @workspace/marketing-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketing-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18472"
BASE_PATH = "/marketing-video/"
