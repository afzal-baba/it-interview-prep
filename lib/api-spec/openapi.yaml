openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: IT Interview Prep API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: IT course catalog
  - name: questions
    description: Interview questions per course and level
  - name: sessions
    description: Quiz sessions
  - name: leaderboard
    description: Leaderboard and scoring
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all available IT courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /courses/{courseId}/questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: Get interview questions for a course and difficulty level
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "404":
          description: Course not found

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Start a new quiz session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/submit:
    post:
      operationId: submitSession
      tags: [sessions]
      summary: Submit answers and get result
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSubmission"
      responses:
        "200":
          description: Quiz result with score and badges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "404":
          description: Session not found

  /leaderboard:
    get:
      operationId: listLeaderboard
      tags: [leaderboard]
      summary: Get top scorers leaderboard
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: level
          in: query
          required: false
          schema:
            type: ["string", "null"]
            enum: [beginner, intermediate, advanced]
        - name: timedMode
          in: query
          required: false
          schema:
            type: ["boolean", "null"]
          description: Filter by timed mode (true/false/null for all)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Leaderboard entries ordered by score desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
    post:
      operationId: createLeaderboardEntry
      tags: [leaderboard]
      summary: Save a player score to the leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaderboardEntryInput"
      responses:
        "201":
          description: Entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntry"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /me/scores:
    get:
      tags: [leaderboard]
      operationId: listMyScores
      summary: Get the authenticated user's personal score history
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The user's leaderboard entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /codelab-progress:
    get:
      operationId: getCodelabProgress
      tags: [leaderboard]
      summary: Get Code Lab progress for the current anonymous session
      responses:
        "200":
          description: Progress for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodelabProgress"
    post:
      operationId: saveCodelabProgress
      tags: [leaderboard]
      summary: Save Code Lab progress for the current anonymous session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodelabProgressInput"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodelabProgress"

  /codelab-scores:
    post:
      operationId: submitCodelabScore
      tags: [leaderboard]
      summary: Submit or update a Code Lab challenge score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodelabScoreInput"
      responses:
        "200":
          description: Score saved or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodelabScoreEntry"
        "400":
          description: Invalid input

  /codelab-leaderboard:
    get:
      operationId: listCodelabLeaderboard
      tags: [leaderboard]
      summary: Get Code Lab leaderboard (total points per player)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Code Lab leaderboard ordered by total points desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodelabLeaderboardEntry"

  /leaderboard/stats:
    get:
      operationId: getLeaderboardStats
      tags: [leaderboard]
      summary: Get aggregated leaderboard statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardStats"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1

        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Course:
      type: object
      required: [id, name, slug, description, icon, category, questionCounts]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        questionCounts:
          type: object
          required: [beginner, intermediate, advanced]
          properties:
            beginner:
              type: integer
            intermediate:
              type: integer
            advanced:
              type: integer

    Question:
      type: object
      required: [id, courseId, level, text, options, correctOptionIndex]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        text:
          type: string
        options:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4
        correctOptionIndex:
          type: integer
        explanation:
          type: ["string", "null"]

    Session:
      type: object
      required: [id, courseId, level, startedAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        startedAt:
          type: string
          format: date-time

    SessionInput:
      type: object
      required: [courseId, level]
      properties:
        courseId:
          type: integer
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        timedMode:
          type: boolean
          default: false

    AnswerInput:
      type: object
      required: [questionId, selectedOptionIndex]
      properties:
        questionId:
          type: integer
        selectedOptionIndex:
          type: integer
        timeTakenMs:
          type: integer
          description: Time taken to answer in milliseconds (for timed mode)

    SessionSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerInput"
        timedMode:
          type: boolean
          default: false

    SessionResult:
      type: object
      required: [sessionId, score, totalQuestions, correctCount, percentage, badges, questionResults]
      properties:
        sessionId:
          type: integer
        score:
          type: integer
        totalQuestions:
          type: integer
        correctCount:
          type: integer
        percentage:
          type: number
        badges:
          type: array
          items:
            type: string
        questionResults:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResult"
        timeBonus:
          type: integer
          description: Bonus points earned from answering quickly in timed mode
        timedMode:
          type: boolean
          description: Whether this session was played in timed mode

    QuestionResult:
      type: object
      required: [questionId, selectedOptionIndex, correctOptionIndex, isCorrect, explanation]
      properties:
        questionId:
          type: integer
        selectedOptionIndex:
          type: integer
        correctOptionIndex:
          type: integer
        isCorrect:
          type: boolean
        explanation:
          type: ["string", "null"]

    LeaderboardEntry:
      type: object
      required: [id, playerName, courseId, courseName, level, score, totalQuestions, percentage, badges, createdAt]
      properties:
        id:
          type: integer
        playerName:
          type: string
        userId:
          type: ["string", "null"]
          description: ID of the authenticated user who posted this score, if any
        courseId:
          type: integer
        courseName:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        score:
          type: integer
        totalQuestions:
          type: integer
        percentage:
          type: number
        badges:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        timedMode:
          type: boolean
          description: Whether this score was achieved in timed mode
        timeBonus:
          type: integer
          description: Time bonus points earned

    LeaderboardEntryInput:
      type: object
      required: [sessionId, playerName]
      properties:
        sessionId:
          type: integer
          description: The session ID whose server-computed result should be recorded
        playerName:
          type: string

    CodelabProgress:
      type: object
      required: [totalScore, completedSlugs]
      properties:
        totalScore:
          type: integer
        completedSlugs:
          type: array
          items:
            type: string

    CodelabProgressInput:
      type: object
      required: [totalScore, completedSlugs]
      properties:
        totalScore:
          type: integer
          minimum: 0
        completedSlugs:
          type: array
          items:
            type: string

    CodelabScoreInput:
      type: object
      required: [playerName, techSlug, techTitle, points]
      properties:
        playerName:
          type: string
        techSlug:
          type: string
        techTitle:
          type: string
        points:
          type: integer
          description: Points earned for this challenge (0–max for that tech)

    CodelabScoreEntry:
      type: object
      required: [id, playerName, techSlug, techTitle, points, updatedAt]
      properties:
        id:
          type: integer
        playerName:
          type: string
        techSlug:
          type: string
        techTitle:
          type: string
        points:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CodelabLeaderboardEntry:
      type: object
      required: [playerName, totalPoints, challengesCompleted]
      properties:
        playerName:
          type: string
        totalPoints:
          type: integer
        challengesCompleted:
          type: integer

    LeaderboardStats:
      type: object
      required: [totalAttempts, avgPercentage, topScore, topScorer, badgeCounts]
      properties:
        totalAttempts:
          type: integer
        avgPercentage:
          type: number
        topScore:
          type: integer
        topScorer:
          type: ["string", "null"]
        badgeCounts:
          type: object
          required: [bronze, silver, gold, platinum]
          properties:
            bronze:
              type: integer
            silver:
              type: integer
            gold:
              type: integer
            platinum:
              type: integer
